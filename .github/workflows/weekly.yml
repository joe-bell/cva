name: weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

# Pushes and pull requests made with `GITHUB_TOKEN` leave the pull request's
# `pull_request` workflows waiting for maintainer approval, so the required
# checks never report on their own. A fine-grained personal access token
# (`WEEKLY_AUTOMATION_TOKEN`) pushes and opens the pull request instead, and
# `GITHUB_TOKEN` stays read-only. The token lives in the `weekly-automation`
# environment, which only `main` may deploy to, so a run dispatched from
# another branch cannot read it.
permissions:
  contents: read

concurrency:
  group: update-weekly-npm-downloads
  cancel-in-progress: false

jobs:
  npm-downloads:
    name: npm-downloads
    if: github.repository == 'joe-bell/cva'
    environment: weekly-automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BRANCH: automation/weekly-npm-downloads
      SNAPSHOT_PATH: docs/src/content/npm-weekly-downloads.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Update snapshot
        run: |
          node --input-type=module --eval '
            const { updateWeeklyDownloads } = await import("./.github/scripts/update-weekly-downloads.ts");
            const result = await updateWeeklyDownloads();
            console.log(result.changed ? "Updated weekly npm downloads." : "Weekly npm downloads are unchanged.");
          '

      - name: Detect changes
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- "$SNAPSHOT_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEEKLY_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/npm-weekly-downloads.json"
          cp "$SNAPSHOT_PATH" "$snapshot"
          git restore -- "$SNAPSHOT_PATH"
          # `pnpm install` above points `core.hooksPath` at `.github/hooks`.
          # Drop it so no repository hook runs while the token is exposed.
          git config --unset-all core.hooksPath || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          # Rebuild the update branch from `main` on every run instead of
          # merging `main` into it: the branch is never checked out, so its
          # contents never run here, and the only new commit is the snapshot,
          # so the push never carries workflow-file changes that the token
          # has no permission to write.
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git switch --create "$UPDATE_BRANCH" origin/main
          cp "$snapshot" "$SNAPSHOT_PATH"
          git add "$SNAPSHOT_PATH"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update weekly npm downloads"

          remote_sha=""
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin \
              "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            remote_sha="$(git rev-parse "origin/$UPDATE_BRANCH")"
            if git diff --quiet "origin/$UPDATE_BRANCH" HEAD; then
              exit 0
            fi
          fi
          git push \
            --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote_sha" \
            origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Open or update pull request
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEEKLY_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          pr_url="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [[ -n "$pr_url" ]]; then
            echo "Updated $pr_url"
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update weekly npm downloads" \
              --body 'Updates `docs/src/content/npm-weekly-downloads.json` with npm’s latest seven-day package totals.'
          fi
