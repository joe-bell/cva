name: weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

# Pushes and pull requests made with `GITHUB_TOKEN` leave the pull request's
# `pull_request` workflows waiting for maintainer approval, so the required
# checks never report on their own. A GitHub App installation token pushes
# and opens the pull request instead, and `GITHUB_TOKEN` stays read-only.
permissions:
  contents: read

concurrency:
  group: update-weekly-npm-downloads
  cancel-in-progress: false

jobs:
  npm-downloads:
    name: npm-downloads
    if: github.repository == 'joe-bell/cva'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BRANCH: automation/weekly-npm-downloads
      SNAPSHOT_PATH: docs/src/content/npm-weekly-downloads.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Update snapshot
        run: |
          node --input-type=module --eval '
            const { updateWeeklyDownloads } = await import("./.github/scripts/update-weekly-downloads.ts");
            const result = await updateWeeklyDownloads();
            console.log(result.changed ? "Updated weekly npm downloads." : "Weekly npm downloads are unchanged.");
          '

      - name: Detect changes
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- "$SNAPSHOT_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create app token
        if: steps.snapshot.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/npm-weekly-downloads.json"
          cp "$SNAPSHOT_PATH" "$snapshot"
          git restore -- "$SNAPSHOT_PATH"
          bot="$APP_SLUG[bot]"
          bot_id="$(gh api "/users/$bot" --jq .id)"
          git config user.name "$bot"
          git config user.email "$bot_id+$bot@users.noreply.github.com"
          gh auth setup-git
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            git fetch --unshallow --no-tags origin
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
            git merge --no-commit --no-ff origin/main
          else
            git switch --create "$UPDATE_BRANCH" origin/main
          fi

          cp "$snapshot" "$SNAPSHOT_PATH"
          git add "$SNAPSHOT_PATH"
          if git diff --cached --quiet && ! git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then
            exit 0
          fi

          git commit -m "chore: update weekly npm downloads"
          git push --set-upstream origin "$UPDATE_BRANCH"

      - name: Open or update pull request
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          pr_url="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [[ -n "$pr_url" ]]; then
            echo "Updated $pr_url"
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update weekly npm downloads" \
              --body 'Updates `docs/src/content/npm-weekly-downloads.json` with npm’s latest seven-day package totals.'
          fi
