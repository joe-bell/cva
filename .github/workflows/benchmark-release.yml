name: benchmark-release

# On every published release (release or prerelease), benchmarks each
# package at the released commit and attaches `benchmark-<package>.json` as
# a release asset — a durable, versioned performance record to compare
# future PRs against.
#
# This doesn't use the shared `./.github/actions/install` composite action:
# that action does its own internal `actions/checkout` with no `ref`
# override, which would silently re-checkout the default ref and discard
# the release tag checked out below (harmless for the `release` trigger,
# where `github.ref` already is the tag, but wrong for a `workflow_dispatch`
# dry run against an older tag). Setup is inlined instead.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to benchmark and attach assets to (leave empty to dry-run on the default branch without uploading)"
        required: false

permissions: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: "pnpm"
          node-version-file: ".nvmrc"
      - run: corepack enable
      - run: pnpm i

      - name: Run benchmarks
        run: pnpm bench

      - name: Upload release assets
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" bench-results/benchmark-*.json --clobber --repo "$GITHUB_REPOSITORY"
