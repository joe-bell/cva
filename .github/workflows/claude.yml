name: claude

# Interactive Claude Code, triggered by an `@claude` mention in an issue, a PR
# comment, or a PR review. There is deliberately no `prompt` input, so the
# action only ever responds to a mention and never runs unattended (and so it
# can't self-trigger from its own comments). Auth is the
# `CLAUDE_CODE_OAUTH_TOKEN` repository secret, alongside the Claude GitHub App
# installed on this repo.
#
# The `./.github/actions/install` step provisions a toolchain, and both its
# checkout and the one above are pinned to the default branch so that happens
# from trusted code.
#
# It does NOT, on its own, let Claude run the test suite. In tag mode the
# action allows only Glob/Grep/LS/Read, its comment tool, and specific
# `Bash(git …)` commands — no general Bash — so `pnpm test`, `pnpm check` and
# `pnpm bundlesize` are denied unless granted explicitly, e.g.
# `claude_args: --allowedTools "Bash(pnpm test),Bash(pnpm check)"`.
#
# That grant is deliberately absent. This repo is public: allowing pnpm here
# would mean executing a contributor's test code once Claude moves to their
# branch, which is the exposure the pins above exist to remove. Add it only
# with that trade-off in mind.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only Joe can trigger Claude. github.actor covers all four
    # event types uniformly and is stricter than the action's built-in
    # write-access check, which repo collaborators would also pass.
    # `triggering_actor` is checked too: a re-run keeps `github.actor` as
    # whoever sent the original event and names the re-runner separately, so
    # actor alone would let a future collaborator replay a write-capable job
    # from one of Joe's comments.
    if: |
      github.actor == 'joe-bell' && github.triggering_actor == 'joe-bell' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push commits to branches
      pull-requests: write # read PR data, post review comments
      issues: write # comment on issues, and on PR conversations via the issues API
      id-token: write # OIDC exchange for the action's app token
      actions: read # read CI results on PRs
    steps:
      # Needed before the local composite action below can be resolved — and
      # `ref` is load-bearing, not tidiness. Omitting it does NOT mean "base
      # branch": for `pull_request_review` and `pull_request_review_comment`
      # GitHub sets the triggering ref to `refs/pull/<n>/merge`, so the default
      # checkout would load `./.github/actions/install` from the contributor's
      # tree and execute it in a job holding `contents: write`. On a public repo
      # that turns "Joe mentions @claude in a review" into arbitrary code
      # execution with the job token. Pin to the default branch so both this
      # checkout and the composite action below come from trusted code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      # `ref` again, and for the same reason: this composite runs its own
      # `actions/checkout`, and its `ref` input defaults to `""`, which checkout
      # treats as unset and resolves to the triggering ref. Left bare, it would
      # undo the pin above — replacing the workspace with the contributor's tree
      # and running `pnpm i` against their `pnpm-workspace.yaml`, including their
      # `allowBuilds` allowlist, which governs install-time script execution.
      - uses: ./.github/actions/install
        with:
          ref: ${{ github.event.repository.default_branch }}
      # `pnpm i` above runs `prepare:hooks`, which points `core.hooksPath` at
      # `.github/hooks`. That directory is not restored from the base branch, so
      # once the action checks out a contributor's PR head, any commit Claude
      # makes would execute *their* `pre-commit` — which sources
      # `scripts/setup-node.sh`, also PR-controlled — with a write-capable
      # token. Unset it: CI enforces formatting regardless, so the hook buys
      # nothing here.
      - name: Drop the repo git-hooks path for this job
        shell: bash
        run: git config --unset-all core.hooksPath || true
      - uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1.0.215
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job-level `actions: read` above governs the workflow token. The
          # action mints its own GitHub App token, and only requests non-default
          # scopes it is told to — so without this, asking Claude to look at a
          # failing CI run gets it a token that cannot read workflow logs.
          additional_permissions: |
            actions: read
          # This repository is public, so comment bodies are attacker-controlled
          # text that gets fed to Claude as input. The action strips the known
          # hiding places (HTML comments, invisible characters, image alt text,
          # hidden attributes), but its own security guidance recommends an
          # actor allowlist on public repos rather than relying on that alone.
          #
          # `claude[bot]` is listed too, and is not optional: without it Claude
          # cannot see its own previous replies, so a follow-up like "apply your
          # second suggestion" loses the thing it refers to.
          #
          # Trade-off, deliberately accepted: Claude no longer sees a
          # contributor's own comments on their PR, so ask it to read the diff
          # rather than "address their feedback". Widen this list if that
          # becomes the common case — it is a usability dial, not a lock.
          include_comments_by_actor: joe-bell,claude[bot]
