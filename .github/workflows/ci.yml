name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Keep this job present on every PR and push: the ruleset requires its
      # context, but baseline installation and benchmarking only matter when a
      # `packages/**` path changed. The `if` condition preserves the
      # `git diff --quiet` exit code under Actions' `bash -e`: 0 is unchanged,
      # 1 is a real diff; any other result fails rather than skipping a
      # benchmark.
      - name: Check package changes
        id: packages
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              range_kind="pull request"
              ;;
            push)
              base_sha="$BASE_SHA"
              head_sha="$HEAD_SHA"
              range_kind="push"
              ;;
            *)
              echo "Unexpected event for benchmark path detection: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full head SHA for $range_kind benchmark path detection." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$base_sha" =~ ^0{40}$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full base SHA for $range_kind benchmark path detection." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$base_sha...$head_sha"
          else
            range="$base_sha..$head_sha"
          fi
          if git diff --quiet "$range" -- 'packages/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi
      - uses: ./.github/actions/install
        if: steps.packages.outputs.changed == 'true'
      - name: Install published baselines
        if: steps.packages.outputs.changed == 'true'
        run: pnpm bench:baselines --out "$RUNNER_TEMP/bench-baselines"
      - name: Run benchmarks
        if: steps.packages.outputs.changed == 'true'
        env:
          BENCH_BASELINES_DIR: ${{ runner.temp }}/bench-baselines
        run: pnpm bench
      # PR code has already run in this job, so do not write a summary from
      # this runner. The separate pr-comment workflow uses a fresh runner and
      # trusted main-branch code to post the benchmark table for every PR.
      - name: Job summary
        if: github.event_name == 'push' && steps.packages.outputs.changed == 'true'
        run: pnpm bench:compare >> "$GITHUB_STEP_SUMMARY"
      - name: Record PR number
        if: github.event_name == 'pull_request' && steps.packages.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '{ "pr": %d }\n' "$PR_NUMBER" > test/bench/.output/meta.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request' && steps.packages.outputs.changed == 'true'
        with:
          name: benchmark-results
          path: test/bench/.output/
          include-hidden-files: true
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installation builds the packages through root prepare:packages.
      - uses: ./.github/actions/install
      - name: Examples
        run: pnpm build:examples
  bundlesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm bundlesize
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm check
      - run: pnpm bench:check
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm prettier --check .
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm lint:skills
  syncpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm syncpack:lint
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm test
      # `./.github/actions/install` already built the packages via the root
      # `prepare` script, so `dist/` is present without a separate build step.
      - run: pnpm --filter cva test:consumer
