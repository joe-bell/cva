overrides:
  "class-variance-authority": "workspace:*"
  "cva": "workspace:*"
  # Keep bundle measurements stable when unrelated tooling updates esbuild.
  "@size-limit/esbuild>esbuild": "0.28.0"
  "mdast-util-directive>mdast-util-to-markdown": "2.1.2"
  "vite": "^8.1.0"

minimumReleaseAge: 4320

packages:
  - "docs"
  - "examples/**"
  - "packages/**"
  - "test/**"

enablePrePostScripts: true

allowBuilds:
  "@swc/core": true
  core-js: true
  esbuild: true
  sharp: true
  svelte-preprocess: true
  workerd: true
