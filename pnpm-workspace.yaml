overrides:
  "class-variance-authority": "workspace:*"
  "cva": "workspace:*"
  # Keep bundle measurements stable when unrelated tooling updates esbuild.
  # GHSA-g7r4-m6w7-qqqr is fixed in 0.28.1; hold the pin at that patch.
  "@size-limit/esbuild>esbuild": "0.28.1"
  "mdast-util-directive>mdast-util-to-markdown": "2.1.2"
  # Security advisories in transitive development dependencies. Drop each entry
  # once every dependent resolves a patched version on its own.
  "brace-expansion@^5.0.0": "^5.0.12" # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  "devalue": "^5.9.2" # GHSA-9rgm-9g3h-6x36
  "fast-uri@^3.0.0": "^3.1.9" # GHSA advisories fixed in 3.1.9 (ajv)
  "http-cache-semantics@^4.0.0": "^4.3.0" # GHSA-ch52-4w7c-c8xp
  "nanoid@^5.0.0": "^5.1.16" # GHSA-28wg-ghj8-5hjv
  "postcss-selector-parser@^6.0.0": "^6.1.5" # fixed in 6.1.5 (postcss-nested)
  "sharp": "^0.35.5" # GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w
  "smol-toml@^1.0.0": "^1.8.1" # GHSA-r4xh-jqrq-34v2
  "source-map-js@^1.0.0": "^1.2.2" # GHSA-68fv-2mgg-jv7q
  "undici@^7.0.0": "^7.30.1" # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-2m5v-pch6-74hx and others
  "undici@^8.0.0": "^8.12.2" # fixed in 8.12.2 (unifont)
  "yaml@^2.0.0": "^2.8.3" # GHSA-48c2-rrv3-qjmp
  "zod@^4.0.0": "^4.6.6" # GHSA-mrhx-c7xc-m3w5 (@astrojs/sitemap pins 4.5.4)

minimumReleaseAge: 4320

packages:
  - "docs"
  - "examples/**"
  - "packages/**"
  - "test/**"

enablePrePostScripts: true

allowBuilds:
  "@swc/core": true
  core-js: true
  esbuild: true
  sharp: true
  svelte-preprocess: true
  workerd: true
